name: Release WordPress Plugin
on:
  push:
    branches: [main]
    paths:
      - 'yandex-smartcaptcha-antispam.php'
      - 'includes/**'
      - 'assets/**'
      - 'readme.txt'
      - '.github/workflows/release-plugin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and test
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^ \* Version: ([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' yandex-smartcaptcha-antispam.php | head -n1)"
          test -n "$VERSION"
          grep -Fqx "Stable tag: $VERSION" readme.txt
          test -f includes/wpr-updates-client.php
          php -l yandex-smartcaptcha-antispam.php
          php -l includes/wpr-updates-client.php
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create installable ZIP and release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ROOT="/tmp/wp-plugin-package/wp-yandex-smartcaptcha-antispam"
          mkdir -p "$ROOT"
          for f in *.php readme.txt README.md CHANGELOG.md LICENSE; do
            if test -f "$f"; then cp "$f" "$ROOT/"; fi
          done
          for d in includes assets languages templates docs; do
            if test -d "$d"; then cp -a "$d" "$ROOT/"; fi
          done
          test -f "$ROOT/yandex-smartcaptcha-antispam.php"
          test -f "$ROOT/includes/wpr-updates-client.php"
          if grep -qi 'plugin-update-checker' "$ROOT/yandex-smartcaptcha-antispam.php"; then
            echo "Old GitHub PUC reference remains in main plugin"
            exit 1
          fi
          find "$ROOT" -type l -print -quit | grep -q . && { echo 'Symlinks forbidden'; exit 1; } || true
          find "$ROOT" -name '*.php' -print0 | xargs -0 -n1 php -l
          cd /tmp/wp-plugin-package
          zip -qr "$GITHUB_WORKSPACE/wp-yandex-smartcaptcha-antispam-v$VERSION.zip" "wp-yandex-smartcaptcha-antispam"
          cd "$GITHUB_WORKSPACE"
          unzip -tq "wp-yandex-smartcaptcha-antispam-v$VERSION.zip"
          gh release create "v$VERSION" "wp-yandex-smartcaptcha-antispam-v$VERSION.zip" --target "$GITHUB_SHA" --title "wp-yandex-smartcaptcha-antispam v$VERSION" --generate-notes
